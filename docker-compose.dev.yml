# Development only. Both services publish to loopback. Authentication is off
# (PI_GATEWAY_INSECURE_DEV) because nothing but this machine can reach it; set
# GATEWAY_PASSWORD instead to test the login flow. Worker data lives in a named
# volume, never in the bind-mounted source tree.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:3000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - dev-data:/data
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
      - PI_GATEWAY=1
      - PI_GATEWAY_INSECURE_DEV=${PI_GATEWAY_INSECURE_DEV:-1}
      - GATEWAY_PASSWORD=${GATEWAY_PASSWORD:-}
      - PI_DATA_DIR=/data/gateway
      - PI_WORKSPACE_DIR=/data/agent/workspaces
      - PI_SESSION_DIR=/data/agent/sessions
      - PI_AGENT_HOME=/data/agent/home
    command: npm run dev:server

volumes:
  dev-data:
