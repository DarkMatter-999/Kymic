# Edge proxy (plain HTTP). For remote access use nginx.tls.conf instead, or put
# your own TLS terminator in front of this. It proxies everything to the app
# container, which serves the frontend, the API and the /gateway WebSocket.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app {
    server app:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Requests are small JSON; chat traffic goes over the WebSocket.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    include /etc/nginx/snippets/app-proxy.conf;
}
