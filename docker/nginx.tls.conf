# Edge proxy with TLS. Mount your certificate and key at /etc/nginx/certs/tls.crt
# and /etc/nginx/certs/tls.key (see docker-compose.prod.yml, profile "tls").
# Set PUBLIC_ORIGIN=https://your.host and COOKIE_SECURE=1 for the app.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app {
    server app:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Container health checks use plain HTTP and must not be redirected.
    location = /health {
        proxy_pass http://app;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    include /etc/nginx/snippets/app-proxy.conf;
}
