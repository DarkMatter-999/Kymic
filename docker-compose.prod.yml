# Production: one app container (gateway + Pi workers), an allowlist egress
# proxy, and an nginx edge. Only the edge publishes a port, on loopback by
# default. Required: GATEWAY_PASSWORD (12+ chars) and PUBLIC_ORIGIN, the exact
# origin users type, e.g. http://127.0.0.1:8080 or https://agents.example.com.
#
#   GATEWAY_PASSWORD=... PUBLIC_ORIGIN=http://127.0.0.1:8080 \
#     docker compose -f docker-compose.prod.yml up -d --build
#
# TLS for remote access (certificate and key in ./certs as tls.crt / tls.key):
#   NGINX_CONF=nginx.tls.conf COOKIE_SECURE=1 PUBLIC_ORIGIN=https://agents.example.com \
#   BIND_ADDRESS=0.0.0.0 HTTP_PORT=80 HTTPS_PORT=443 \
#     docker compose -f docker-compose.prod.yml up -d --build

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  app:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runtime
    image: code-mode-agents:latest
    # The gateway starts as root only to run each Pi worker as the unprivileged
    # "agent" user; these are the only capabilities it keeps (CHOWN and FOWNER to
    # prepare the data volume on every start). DAC_READ_SEARCH
    # lets it read worker-owned session files without being able to write them.
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_READ_SEARCH]
    environment:
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:?set GATEWAY_PASSWORD (12+ characters)}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the exact browser origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      # Workers and the gateway's own provider sign-in reach the internet only
      # through the allowlist proxy; this network has no other route out.
      PI_WORKER_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NODE_USE_ENV_PROXY: '1'
      NO_PROXY: localhost,127.0.0.1,egress,app
    volumes:
      - app-data:/data
    networks: [internal]
    expose: ['3000']
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    depends_on:
      egress:
        condition: service_started

  egress:
    <<: *hardening
    image: code-mode-agents:latest
    entrypoint: []
    command: ['node', 'dist-server/egress.js']
    user: node
    environment:
      PORT: '3128'
      # Starting point: model providers and their sign-in hosts. Adjust to the
      # providers you actually use; anything not listed is refused.
      EGRESS_ALLOW: ${EGRESS_ALLOW:-api.openai.com,auth.openai.com,chatgpt.com,api.anthropic.com,console.anthropic.com,claude.ai,openrouter.ai,generativelanguage.googleapis.com,accounts.google.com,oauth2.googleapis.com,github.com,api.github.com,api.githubcopilot.com}
      EGRESS_ALLOW_PRIVATE: ${EGRESS_ALLOW_PRIVATE:-}
    networks: [internal, edge]
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3128,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443'
    volumes:
      - ./docker/${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./docker/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [internal, edge]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:

networks:
  # No route to the internet: workers can only talk to the app and the egress proxy.
  internal:
    internal: true
  edge: {}
